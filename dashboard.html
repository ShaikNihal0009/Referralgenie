<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* General Page Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 60px; /* Collapsed width */
            height: 100vh;
            background: linear-gradient(to bottom, #6d5dfc, #ba68c8);
            color: white;
            padding: 20px 10px;
            position: fixed;
            left: 0;
            top: 0;
            transition: width 0.3s;
            overflow: hidden;
        }

        .sidebar.expanded {
            width: 220px;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            margin-bottom: 10px;
            display: block;
            width: 100%;
            text-align: left;
        }

        .sidebar h2, .sidebar p {
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.3s;
        }

        .sidebar p {
            cursor: pointer;
            padding: 10px;
            transition: 0.3s;
        }

        .sidebar p:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Content Wrapper */
        .content-wrapper {
            flex-grow: 1;
            padding: 40px;
            margin-left: 70px;
            transition: margin-left 0.3s;
        }

        .content-wrapper.expanded {
            margin-left: 230px;
        }

        /* Container Box */
        .container {
            width: 100%;
            max-width: 900px;
            background: #111;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(255, 255, 255, 0.1);
            padding: 30px;
        }

        /* Dropdown Styling */
        .custom-dropdown {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            background: #222;
            color: white;
            font-size: 16px;
            border: 1px solid #444;
        }

        /* Hide Profile section initially */
        #profile-section {
            display: none;
        }

        /* Save Button */
        .save-btn {
            background: linear-gradient(to right, #6d5dfc, #ba68c8);
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 30px;
            transition: 0.3s;
            box-shadow: 0px 3px 10px rgba(255, 94, 98, 0.5);
            display: block;
            margin: 20px auto;
        }

        .save-btn:hover {
            background: linear-gradient(to right, #5a4afc, #9b5bbb);
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <h2>Dashboard</h2>
    <p onclick="showDashboard()">Dashboard</p>
    <p onclick="showProfile()">Profile</p>
    <p>Send a Referral Request</p>
    <p>Application Status</p>
    <p>Chat</p>
    <p>Contact Support</p>
</div>

<!-- Main Content -->
<div class="content-wrapper" id="content-wrapper">
    <!-- Dashboard Section (Graphs) -->
    <div class="container" id="dashboard-section">
        <h2>Applications Overview</h2>
        <canvas id="barChart"></canvas>
        <canvas id="pieChart"></canvas>
    </div>

    <!-- Profile Section -->
    <div class="container" id="profile-section">
        <h2>John Doe</h2>
        <p><strong>Email:</strong> <input type="text" id="email" value="johndoe@email.com" class="custom-dropdown" disabled></p>
        <p><strong>Phone:</strong> <input type="text" id="phone" value="(91) 9045697890" class="custom-dropdown" disabled></p>
        <p><strong>Resume:</strong> <input type="file" id="resume" class="custom-dropdown" disabled></p>

        <p><strong>Job Category:</strong></p>
        <select class="custom-dropdown" onchange="showDetails(this.value)">
            <option value="">Select Category</option>
            <option value="fresherDetails">Fresher</option>
            <option value="internshipDetails">Internship</option>
            <option value="experiencedDetails">Experienced</option>
        </select>

        <div id="fresherDetails" class="details-section">
            <input type="text" placeholder="College Name" class="custom-dropdown">
            <input type="text" placeholder="Pincode" class="custom-dropdown">
            <input type="text" placeholder="Skills" class="custom-dropdown">
        </div>

        <div id="internshipDetails" class="details-section">
            <input type="text" placeholder="Company Name" class="custom-dropdown">
            <input type="text" placeholder="Company Location" class="custom-dropdown">
            <input type="text" placeholder="Internship Duration" class="custom-dropdown">
        </div>

        <div id="experiencedDetails" class="details-section">
            <input type="text" placeholder="Company Name" class="custom-dropdown">
            <input type="text" placeholder="Total Experience" class="custom-dropdown">
            <input type="text" placeholder="Notice Period" class="custom-dropdown">
        </div>
    </div>
</div>

<script>
    function toggleMenu() {
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content-wrapper");
        sidebar.classList.toggle("expanded");
        content.classList.toggle("expanded");
    }

    function showDashboard() {
        document.getElementById("dashboard-section").style.display = "block";
        document.getElementById("profile-section").style.display = "none";
    }

    function showProfile() {
        document.getElementById("dashboard-section").style.display = "none";
        document.getElementById("profile-section").style.display = "block";
    }

    function showDetails(selectedCategory) {
        document.querySelectorAll('.details-section').forEach(section => {
            section.style.display = "none";
        });

        if (selectedCategory) {
            document.getElementById(selectedCategory).style.display = "block";
        }
    }

    // Chart Data
    const barCtx = document.getElementById("barChart").getContext("2d");
    new Chart(barCtx, {
        type: "bar",
        data: {
            labels: ["Jan", "Feb", "Mar", "Apr", "May"],
            datasets: [{ label: "No. of Applications", data: [10, 20, 30, 40, 50], backgroundColor: "rgba(75, 192, 192, 0.6)" }]
        }
    });

    const pieCtx = document.getElementById("pieChart").getContext("2d");
    new Chart(pieCtx, {
        type: "pie",
        data: { labels: ["Accepted", "Rejected", "On Hold"], datasets: [{ data: [40, 30, 30], backgroundColor: ["#4caf50", "#f44336", "#ff9800"] }] }
    });
</script>

</body>
</html>
