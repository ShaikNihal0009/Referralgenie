<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* General Page Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 60px; /* Initially Collapsed */
            height: 100vh;
            background: linear-gradient(to bottom, #6d5dfc, #ba68c8);
            color: white;
            padding: 20px 10px;
            position: fixed;
            left: 0;
            top: 0;
            transition: width 0.3s ease-in-out;
            overflow: hidden;
        }

        .sidebar.expanded {
            width: 220px;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            margin-bottom: 10px;
            display: block;
            width: 100%;
            text-align: left;
        }

        .sidebar .menu-items {
            display: none;
        }

        .sidebar.expanded .menu-items {
            display: block;
        }

        .menu-items p {
            cursor: pointer;
            padding: 10px;
            transition: 0.3s;
            white-space: nowrap;
            overflow: hidden;
        }

        .menu-items p:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Content Wrapper */
        .content-wrapper {
            flex-grow: 1;
            padding: 40px;
            margin-left: 70px;
            transition: margin-left 0.3s ease-in-out;
            width: 100%;
        }

        .content-wrapper.expanded {
            margin-left: 230px;
        }

        /* Container Box */
        .container {
            width: 100%;
            max-width: 900px;
            background: #111;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(255, 255, 255, 0.1);
            padding: 30px;
            margin: auto;
            display: none; /* Hide all sections by default */
        }

        .container.active {
            display: block;
        }

        /* Profile Edit Icon */
        .edit-icon {
            cursor: pointer;
            font-size: 22px;
            color: #6d5dfc;
            transition: 0.3s;
            margin-left: 10px;
        }

        .edit-icon:hover {
            color: #4a3bfc;
        }

        /* Input and Dropdown Styling */
        input[type="text"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            font-size: 16px;
            border: 1px solid #444;
        }

        select {
            appearance: none;
        }

        /* Job Category Sections */
        .details-section {
            display: none;
            padding: 15px;
            border: 1px solid #6d5dfc;
            background: #222;
            border-radius: 5px;
            margin-top: 10px;
        }

        /* Save Button */
        .save-btn {
            background: linear-gradient(to right, #6d5dfc, #ba68c8);
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 30px;
            transition: 0.3s;
            box-shadow: 0px 3px 10px rgba(255, 94, 98, 0.5);
            display: block;
            margin: 20px auto;
        }

        .save-btn:hover {
            background: linear-gradient(to right, #5a4afc, #9b5bbb);
        }

        /* Responsive Fixes */
        @media (max-width: 768px) {
            .sidebar {
                width: 50px;
            }

            .sidebar.expanded {
                width: 180px;
            }

            .content-wrapper {
                margin-left: 55px;
            }

            .content-wrapper.expanded {
                margin-left: 190px;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="menu-items">
        <h2>Dashboard</h2>
        <p onclick="showSection('dashboard-section')">Dashboard</p>
        <p onclick="showSection('profile-section')">Profile</p>
        <p onclick="showSection('applications-section')">Application Status</p>
        <p onclick="showSection('contact-section')">Contact Support</p>
    </div>
</div>

<!-- Main Content -->
<div class="content-wrapper" id="content-wrapper">
    <!-- Dashboard Section (Graphs) -->
    <div class="container active" id="dashboard-section">
        <h2>Applications Overview</h2>
        <canvas id="barChart"></canvas>
        <canvas id="pieChart"></canvas>
    </div>

    <!-- Profile Section -->
    <div class="container" id="profile-section">
        <h2>John Doe <span class="edit-icon" onclick="enableEdit()">✏</span></h2>
        <p><strong>Email:</strong> <input type="text" id="email" value="johndoe@email.com" disabled></p>
        <p><strong>Phone:</strong> <input type="text" id="phone" value="(91) 9045697890" disabled></p>
        <p><strong>Resume:</strong> <input type="file" id="resume" disabled></p>

        <p><strong>Job Category:</strong></p>
        <select onchange="showDetails(this.value)">
            <option value="">Select Category</option>
            <option value="fresherDetails">Fresher</option>
            <option value="internshipDetails">Internship</option>
            <option value="experiencedDetails">Experienced</option>
        </select>

        <div id="fresherDetails" class="details-section">
            <input type="text" placeholder="College Name">
            <input type="text" placeholder="Pincode">
            <input type="text" placeholder="Skills">
        </div>

        <div id="internshipDetails" class="details-section">
            <input type="text" placeholder="Company Name">
            <input type="text" placeholder="Company Location">
        </div>

        <div id="experiencedDetails" class="details-section">
            <input type="text" placeholder="Company Name">
            <input type="text" placeholder="Total Experience">
        </div>
    </div>
</div>

<script>
    function toggleMenu() {
        document.getElementById("sidebar").classList.toggle("expanded");
        document.getElementById("content-wrapper").classList.toggle("expanded");
    }

    function showSection(sectionId) {
        document.querySelectorAll('.container').forEach(section => section.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
        document.getElementById("sidebar").classList.remove("expanded");
        document.getElementById("content-wrapper").classList.remove("expanded");
    }

    function enableEdit() {
        document.getElementById("email").disabled = false;
        document.getElementById("phone").disabled = false;
        document.getElementById("resume").disabled = false;
    }
</script>

</body>
</html>
